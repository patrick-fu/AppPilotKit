[package]
name = "apppilotkit-cli-contract"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "apppilotkit_cli_contract"

[[bin]]
name = "apppilotkit-cli-contract-fixture"
path = "src/bin/contract-fixture.rs"
test = false
bench = false
doc = false

[dependencies]
clap = { version = "=4.6.5", default-features = false, features = ["error-context", "help", "std", "string", "suggestions", "usage"] }
jsonschema = { version = "=0.49.3", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
