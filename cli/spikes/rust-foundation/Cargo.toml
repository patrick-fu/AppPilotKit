[package]
name = "apppilotkit-rust-foundation-spike"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "apppilotkit_rust_foundation_spike"

[dependencies]
clap = { version = "=4.6.5", default-features = false, features = ["error-context", "help", "std", "suggestions", "usage"] }
jsonschema = { version = "=0.49.3", default-features = false }
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rustix = { version = "=1.1.4", default-features = false, features = ["process", "std"] }
sha2 = { version = "=0.11.0", default-features = false }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }
