[package]
name = "apppilotkit-transport-crypto-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
minicbor = { version = "=0.25.1", features = ["std"] }
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }
zeroize = "=1.9.0"

[dev-dependencies]
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[workspace]
