[package]
name = "apppilotkit-transport-contract-reference"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
autobins = false

[[bin]]
name = "apppilotkit-transport-contract-reference"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
cddl = { version = "=0.10.4", default-features = false }
hex = "=0.4.3"
jsonschema = { version = "=0.49.3", default-features = false }
minicbor = { version = "=0.25.1", features = ["std"] }
plist = "=1.8.0"
serde = "=1.0.229"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }

[workspace]
