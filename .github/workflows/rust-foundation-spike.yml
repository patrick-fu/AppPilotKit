name: Rust CLI native verification

on:
  pull_request:
    paths:
      - ".github/workflows/rust-foundation-spike.yml"
      - "cli/**"
      - "protocol/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-macos:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      SPIKE_PACKAGE: apppilotkit-rust-foundation-spike
      SPIKE_BINARY: apppilotkit-rust-foundation-spike
      CONTRACT_PACKAGE: apppilotkit-cli-contract
      CONTRACT_TEST_BINARY: apppilotkit-cli-contract-fixture

    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain 1.94.0 "${{ matrix.target }}"

      - name: Fetch locked dependencies
        working-directory: cli
        run: cargo +1.94.0 fetch --locked --target "${{ matrix.target }}"

      - name: Measure clean release build
        working-directory: cli
        run: |
          rm -rf target
          mkdir -p "../artifacts/rust-foundation-${{ matrix.target }}"
          /usr/bin/time -lp cargo +1.94.0 build \
            --release --locked --package "$SPIKE_PACKAGE" \
            --bin "$SPIKE_BINARY" --target "${{ matrix.target }}" \
            2>"../artifacts/rust-foundation-${{ matrix.target }}/clean-build.time"

      - name: Build production contract core and black-box host
        working-directory: cli
        run: |
          cargo +1.94.0 build --release --locked \
            --package "$CONTRACT_PACKAGE" --lib --target "${{ matrix.target }}"
          cargo +1.94.0 build --release --locked \
            --package "$CONTRACT_PACKAGE" --bin "$CONTRACT_TEST_BINARY" \
            --target "${{ matrix.target }}"

      - name: Verify formatting, lints, and tests offline
        working-directory: cli
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo +1.94.0 fmt --all -- --check
          cargo +1.94.0 clippy --workspace --all-targets --all-features \
            --locked --target "${{ matrix.target }}" -- -D warnings
          cargo +1.94.0 test --workspace --all-targets --all-features \
            --locked --target "${{ matrix.target }}"

      - name: Verify native thin artifact and record runtime metrics
        working-directory: cli
        run: |
          metrics="../artifacts/rust-foundation-${{ matrix.target }}"
          source="target/${{ matrix.target }}/release/$SPIKE_BINARY"
          artifact="$metrics/$SPIKE_BINARY-${{ matrix.target }}"
          cp "$source" "$artifact"
          test "$(uname -m)" = "${{ matrix.arch }}"
          test "$(lipo -archs "$artifact")" = "${{ matrix.arch }}"
          stat -f 'unsigned_bytes=%z' "$artifact" >"$metrics/binary-size.txt"
          codesign --force --sign - --timestamp=none "$artifact"
          codesign --verify --strict --verbose=2 "$artifact"
          stat -f 'signed_bytes=%z' "$artifact" >>"$metrics/binary-size.txt"
          shasum -a 256 "$artifact" >"$metrics/binary.sha256"
          /usr/bin/time -lp "$artifact" manifest \
            >"$metrics/first-run.json" 2>"$metrics/first-run.time"
          "$artifact" manifest >/dev/null
          /usr/bin/time -p sh -eu -c '
            index=0
            while [ "$index" -lt 200 ]; do
              "$1" manifest >/dev/null
              index=$((index + 1))
            done
          ' sh "$artifact" 2>"$metrics/warm-200.time"
          : >"$metrics/rss.txt"
          index=0
          while [ "$index" -lt 20 ]; do
            /usr/bin/time -lp "$artifact" manifest >/dev/null 2>>"$metrics/rss.txt"
            index=$((index + 1))
          done
          awk '
            /maximum resident set size/ { sum += $1; count += 1 }
            END { printf "runs=%d mean_max_rss_bytes=%.0f\n", count, sum / count }
          ' "$metrics/rss.txt" >"$metrics/rss-summary.txt"
          cargo +1.94.0 metadata --locked --format-version 1 \
            >"$metrics/cargo-metadata.json"
          jq '[.packages[] | {name, version, license}]' \
            "$metrics/cargo-metadata.json" >"$metrics/licenses.json"

      - name: Run existing protocol contract suite
        run: |
          npm --prefix protocol ci
          npm --prefix protocol test
          npm --prefix protocol audit --audit-level=high

      - name: Audit locked Rust dependencies
        if: matrix.target == 'aarch64-apple-darwin'
        working-directory: cli
        run: |
          cargo +1.94.0 install cargo-audit --version 0.22.2 --locked
          cargo +1.94.0 audit --file Cargo.lock --format json \
            >"../artifacts/rust-foundation-${{ matrix.target }}/cargo-audit.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-foundation-${{ matrix.target }}
          path: artifacts/rust-foundation-${{ matrix.target }}
